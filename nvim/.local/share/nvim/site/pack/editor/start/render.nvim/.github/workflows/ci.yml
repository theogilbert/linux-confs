name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A second push to the same branch cancels the run the first one started.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: tests (${{ matrix.neovim }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The floor the plugin claims, the version people run, and the
        # one that breaks it next.
        neovim: [v0.10.4, stable, nightly]
    steps:
      - uses: actions/checkout@v4
      # Fetched by hand: rhysd/action-setup-vim renames out of /tmp into
      # $HOME and fails with EXDEV where the two are different devices.
      - name: install neovim
        run: |
          mkdir -p "$HOME/nvim"
          curl -fsSL "https://github.com/neovim/neovim/releases/download/${{ matrix.neovim }}/nvim-linux-x86_64.tar.gz" |
            tar xz -C "$HOME/nvim" --strip-components=1
          echo "$HOME/nvim/bin" >> "$GITHUB_PATH"
      - run: nvim --version
      - name: run the suite
        run: ./tests/run.sh

  luacheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: lunarmodules/luacheck@v1
        with:
          args: lua plugin tests

  stylua:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: JohnnyMorganz/stylua-action@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          version: 2.1.0
          args: --check lua plugin tests

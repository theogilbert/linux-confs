# The formatter's copy of the house style. 100 columns because that is
# where the code stops fitting, not where the prose does: comments are
# wrapped by hand at about 72, and stylua does not touch them.
column_width = 100
line_endings = "Unix"
indent_type = "Spaces"
indent_width = 2
quote_style = "AutoPreferDouble"
call_parentheses = "Always"
collapse_simple_statement = "Never"
